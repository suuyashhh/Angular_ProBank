
<div class="layout-wrapper layout-content-navbar">
  <!-- Overlay (only active on small screens via CSS) -->
<div class="layout-overlay" [class.show-overlay]="sidebarCollapsed"></div>


  <div class="layout-container">
    <!-- Menu -->
    <aside id="layout-menu"
           class="layout-menu menu-vertical menu bg-menu-theme"
           [class.collapsed]="sidebarCollapsed">
      <div class="menu-inner-shadow"></div>
      <app-sidebar></app-sidebar>
    </aside>
    <!-- / Menu -->

    <!-- Layout container -->
    <div class="layout-page" [class.full-width]="sidebarCollapsed">
      <!-- Navbar -->
      <app-navbar (toggleSidebar)="onToggleSidebar()"></app-navbar>
      <!-- / Navbar -->

      <!-- Content wrapper -->
      <router-outlet></router-outlet>
      <div class="content-backdrop fade"></div>
    </div>
    <!-- / Layout page -->
  </div>
</div>
